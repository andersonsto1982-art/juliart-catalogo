<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfica Juliart — Menu de Serviços</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header class="text-center mb-4">
        <div class="container">
            <h1><i class="fa-solid fa-print me-2"></i> Gráfica Juliart</h1>
            <p class="lead mb-0">Catálogo de Serviços & Menu Digital</p>
        </div>
    </header>

    <main class="container mb-5">
        <!-- Controls & Actions -->
        <div class="row g-3 mb-4 align-items-center">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fa-solid fa-search text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="Buscar serviço...">
                </div>
            </div>
            <div class="col-md-3">
                <select id="categoryFilter" class="form-select">
                    <option value="">Todas as Categorias</option>
                    <option value="Impressões & Cópias">Impressões & Cópias</option>
                    <option value="Fotografia & Restauração">Fotografia & Restauração</option>
                    <option value="Brindes & Personalizados">Brindes & Personalizados</option>
                    <option value="Design & Web">Design & Web</option>
                </select>
            </div>
            <div class="col-md-4 text-md-end">
                <button class="btn btn-success w-100" onclick="generateWhatsAppMenu()">
                    <i class="fa-brands fa-whatsapp me-1"></i> Copiar Menu WhatsApp
                </button>
            </div>
        </div>

        <!-- Services Grid -->
        <div class="row" id="servicesGrid">
            <!-- Dynamic Content loaded via JavaScript -->
        </div>
    </main>

    <!-- WhatsApp Modal Preview -->
    <div class="modal fade" id="whatsappModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fa-brands fa-whatsapp me-2"></i> Menu Formatado para WhatsApp</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Copie o texto abaixo e envie diretamente para seus clientes ou grupos:</p>
                    <textarea id="whatsappOutput" class="form-control font-monospace" rows="12" readonly></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-success" onclick="copyWhatsAppText()">
                        <i class="fa-solid fa-copy me-1"></i> Copiar Texto
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
